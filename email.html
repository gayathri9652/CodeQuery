<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeQuery</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <h1>🎮 CodeQuery</h1>

    <h2>Welcome Back!</h2>

    <p>
        Login to continue your coding adventure.
    </p>



    <form id="loginForm">


        <input 
        type="email"
        id="email"
        placeholder="Email Address"
        required>


        <input 
        type="password"
        id="password"
        placeholder="Password"
        required>



        <button type="submit">
            LOGIN
        </button>


    </form>



    <p class="signup-text">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </p>



    <p class="back-text">

        <a href="index.html">
            ← Back to Home
        </a>

    </p>



</div>




<script src="script.js"></script>


</body>

</html>
