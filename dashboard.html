<!DOCTYPE html>
<html>
<head>
    <title>CodeQuery Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="home-container">

<h1>🎮 CodeQuery Dashboard</h1>
<div class="profile-card">

<h2>👋 Welcome <span id="userName">Coder</span></h2>

<p>📧 <span id="userEmail"></span></p>

<p>⭐ XP: <span id="userXP">0</span></p>

<p>🪙 Coins: <span id="userCoins">0</span></p>

</div>

<h2>Your Coding Journey</h2>

<div class="card">

    <a href="worlds.html">
    <button>🌍 Start Adventure</button>
</a>

    <button onclick="continueGame()">▶ Continue</button>

    <a href="leader.html">
        <button>🏆 Leaderboard</button>
    </a>

</div>


<hr>

<div id="progressBox">

    <div class="progress">
        <div id="progressFill"></div>
    </div>

</div>

<div id="certificateBox" style="display:none;">

<a href="certificate.html">

<button>📜 View Certificate</button>

</a>

</div>


<script>


function continueGame(){

    let lastPage = localStorage.getItem("lastPage");

    if(lastPage){

        window.location.href = lastPage;

    }
    else{

        window.location.href = "languages.html";

    }

}


// Load User Data

let name = localStorage.getItem("username");
let email = localStorage.getItem("userEmail");


if(name){

    document.getElementById("userName").innerHTML = name;

}


if(email){

    document.getElementById("userEmail").innerHTML = email;

}
let savedXP = localStorage.getItem("XP");
let savedCoins = localStorage.getItem("Coins");


if(savedXP){

    document.getElementById("userXP").innerHTML = savedXP;

}


if(savedCoins){

    document.getElementById("userCoins").innerHTML = savedCoins;

}
let xp = Number(localStorage.getItem("XP")) || 0;

let progress = (xp / 500) * 100;

if(progress > 100){
    progress = 100;
}

document.getElementById("progressFill").style.width = progress + "%";

</script>




</body>
</html>
