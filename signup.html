<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - CodeQuery</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <h1>🎮 CodeQuery</h1>

    <h2>Create Account</h2>

    <p>
        Join your coding adventure!
    </p>


    <form id="signupForm">


        <input 
        type="text"
        id="username"
        placeholder="Username"
        required>


        <input 
        type="email"
        id="signupEmail"
        placeholder="Email Address"
        required>


        <input 
        type="password"
        id="signupPassword"
        placeholder="Password"
        required>


        <button type="submit">
            SIGN UP
        </button>


    </form>


    <p class="back-text">

        <a href="main.html">
            ← Back to Home
        </a>

    </p>


</div>



<script src="script.js"></script>


</body>

</html>
